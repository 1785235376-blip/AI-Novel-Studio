[project]
name = "ai-novel-studio"
version = "0.7.0"
description = "Local-first hybrid AI novel production service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "sqlalchemy>=2.0,<3", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "reportlab>=4.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "file_backend_only: validates File repository or filesystem-specific behavior and remains covered by the default/File full suite",
    "postgres_backend_only: validates real PostgreSQL behavior and remains covered by the PostgreSQL full suite",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "frontend*", "novel_data*", "prompts*", "workflows*"]
